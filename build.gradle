plugins {
    id 'com.android.application' version '9.3.1' apply false
    id 'com.android.library' version '9.3.1' apply false
}

allprojects {
    group = 'com.damon.bbll'
    version = '0.1-source-recovery'
    configurations.configureEach {
        // The recovered messages extend GeneratedMessageLite. A full-runtime
        // protobuf-java would duplicate classes and is intentionally excluded.
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }
}
