pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri('https://jitpack.io')
            content { includeGroup 'com.github.franmontiel' }
        }
    }
}
rootProject.name = 'BBLLStandalone'
include ':domain', ':network', ':app'
include ':asimplecache'
project(':asimplecache').projectDir = file('vendor/asimplecache')
